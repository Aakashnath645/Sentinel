<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel | Seismic Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tech Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --color-bg-dark: #020617;
        --color-neon-cyan: #06b6d4;
        --color-neon-red: #ef4444;
      }
      
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: var(--color-bg-dark);
        color: #e2e8f0;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border: 1px solid #1e293b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4; 
      }

      /* --- MAP GLOW EFFECTS --- */
      /* These target the SVG paths generated by Leaflet */
      path.leaflet-interactive:focus {
        outline: none;
      }
      
      /* Neon Glows via CSS Filters */
      path.quake-low {
        filter: drop-shadow(0 0 2px #10b981);
        stroke: #10b981;
        stroke-width: 1;
        fill-opacity: 0.6;
      }
      path.quake-med {
        filter: drop-shadow(0 0 4px #eab308);
        stroke: #eab308;
        stroke-width: 1;
      }
      path.quake-high {
        filter: drop-shadow(0 0 6px #f97316);
        stroke: #f97316;
        stroke-width: 2;
      }
      path.quake-extreme {
        filter: drop-shadow(0 0 10px #ef4444);
        stroke: #ef4444;
        stroke-width: 2;
        animation: pulse-stroke 2s infinite alternate;
      }

      @keyframes pulse-stroke {
        from { stroke-width: 2; opacity: 0.8; }
        to { stroke-width: 4; opacity: 1; }
      }

      /* --- CYBER UI ELEMENTS --- */
      
      /* Scanline texture */
      .bg-scanline {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
      }

      /* Grid texture */
      .bg-grid {
        background-size: 20px 20px;
        background-image:
          linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
      }

      /* Popup Styling */
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: rgba(2, 6, 23, 0.9);
        color: #f1f5f9;
        border: 1px solid #06b6d4;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        border-radius: 0px; /* Angular corners */
        backdrop-filter: blur(4px);
      }
      .leaflet-container a.leaflet-popup-close-button {
        color: #06b6d4;
      }
      
      .leaflet-container {
        background: #020617;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4"
  }
}
</script>
</head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden selection:bg-cyan-500/30">
    <div id="root"></div>
  </body>
</html>
