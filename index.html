<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel | Seismic Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tech Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      :root {
        --color-bg-dark: #020617;
        --color-neon-cyan: #06b6d4;
        --color-neon-red: #ef4444;
      }
      
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: var(--color-bg-dark);
        color: #e2e8f0;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border: 1px solid #1e293b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4; 
      }

      /* --- MAP GLOW EFFECTS --- */
      /* These target the SVG paths generated by Leaflet */
      path.leaflet-interactive:focus {
        outline: none;
      }
      
      /* Tectonic Plates Glow */
      path.tectonic-line {
        filter: drop-shadow(0 0 3px #06b6d4);
        stroke-dasharray: 6 3; /* Dashed tech look */
      }

      /* --- TSUNAMI ANIMATION --- */
      @keyframes ripple-flash {
        0% { stroke-width: 2; stroke-opacity: 1; opacity: 1; }
        100% { stroke-width: 25; stroke-opacity: 0; opacity: 0; }
      }

      path.tsunami-ring {
        animation: ripple-flash 2s infinite ease-out;
        transform-origin: center;
        fill: none;
      }

      /* Standard Markers with Depth Colors (Applied via inline styles mostly, but glow helper classes here) */
      path.quake-marker {
        transition: all 0.3s ease;
      }
      path.quake-marker:hover {
        filter: brightness(1.5) drop-shadow(0 0 5px white);
        stroke-width: 3;
      }

      /* --- MAGMA / VOLCANO ANIMATION --- */
      @keyframes magma-burn {
        0% { box-shadow: 0 0 5px #f97316; background-color: #fb923c; }
        50% { box-shadow: 0 0 20px #c2410c, 0 0 10px #f97316; background-color: #fff7ed; }
        100% { box-shadow: 0 0 5px #f97316; background-color: #fb923c; }
      }

      .volcano-icon-marker {
        animation: magma-burn 3s infinite ease-in-out;
      }

      /* --- CYBER UI ELEMENTS --- */
      
      /* Scanline texture */
      .bg-scanline {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
      }

      /* Grid texture */
      .bg-grid {
        background-size: 20px 20px;
        background-image:
          linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
      }

      /* Popup Styling */
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: rgba(2, 6, 23, 0.9);
        color: #f1f5f9;
        border: 1px solid #06b6d4;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        border-radius: 0px; /* Angular corners */
        backdrop-filter: blur(4px);
      }
      .leaflet-container a.leaflet-popup-close-button {
        color: #06b6d4;
      }
      
      .leaflet-container {
        background: #020617;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4"
  }
}
</script>
</head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden selection:bg-cyan-500/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
